<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HIP-CERDIK Android</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#173b36;background:#e9f2ef}*{box-sizing:border-box}body{margin:0}.app{max-width:460px;margin:auto;min-height:100dvh;background:#f8fcfa;box-shadow:0 0 30px #174c3420}.top{background:linear-gradient(125deg,#087f69,#15a489);color:white;padding:25px 20px 20px;border-radius:0 0 24px 24px}.top h1{font-size:23px;margin:4px 0}.top p{margin:0;font-size:13px;opacity:.9}.main{padding:18px 17px 95px}.card{background:white;border:1px solid #dceae4;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 3px 10px #174c3409}.card h3{margin:0 0 9px}.muted{color:#627c76;font-size:13px}.btn{border:0;background:#087f69;color:white;border-radius:12px;padding:13px 15px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.btn.alt{background:#e0f3ed;color:#087f69}.btn.warn{background:#b73535}.btn:disabled{opacity:.45}input,select{width:100%;padding:12px;border:1px solid #c8ddd5;border-radius:10px;margin:6px 0 12px;font-size:16px;background:white}label{display:block;font-size:14px;font-weight:600}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:flex;background:white;border-top:1px solid #d6e5df;z-index:10}.nav button{flex:1;background:none;border:0;padding:10px 2px;color:#527a6d;font-size:11px;cursor:pointer}.nav button.active{color:#087f69;font-weight:800}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:18px 10px;border:1px solid #d4e9df;border-radius:15px;background:#fff;text-align:center;cursor:pointer;font-size:13px;font-weight:700}.tile b{display:block;font-size:26px;margin-bottom:6px}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#e4f4eb;color:#116a4b;font-size:12px;font-weight:700}.progress{height:9px;background:#e4eae7;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#0d9875}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #bcd9cb;border-radius:12px;padding:15px;margin:8px 0;cursor:pointer}.choice.sel{border:2px solid #0b8c6d;background:#e7f7f1}.alert{background:#fff2dd;border-left:4px solid #d99416;padding:12px;border-radius:8px;font-size:13px}.danger{background:#ffebeb;border-left-color:#c33434}.good{background:#e6f6ed;border-left-color:#168655}.big{font-size:34px;font-weight:800;color:#087f69}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row>*{flex:1}svg{width:100%;height:170px}.small{font-size:12px}.list{padding-left:20px;line-height:1.65}.check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e5efea}.check input{width:19px;height:19px;margin:0}.check label{flex:1}.hidden{display:none}</style></head><body><div class="app"><header class="top"><div class="small">💚 HIP-CERDIK • Prototipe Android</div><h1 id="heading">Selamat Datang</h1><p id="subtitle">Kenali risiko, bangun kebiasaan sehat.</p></header><main class="main" id="content"></main><nav class="nav" id="nav"></nav></div><script>
const Q=['Apakah ayah atau ibu kandung Anda menderita hipertensi?','Apakah saudara sekandung Anda menderita hipertensi?','Apakah tubuh Anda saat ini gemuk?','Apakah usia Anda 50 tahun atau lebih?','Apakah Anda merokok?','Apakah Anda terbiasa makan makanan asin?','Apakah Anda terbiasa makan makanan bersantan?','Apakah Anda terbiasa makan makanan berlemak hewani?','Apakah Anda sering merasa sakit kepala?','Apakah Anda sering merasa kaku di tengkuk?','Apakah Anda merasa tertekan di lingkungan kerja atau keluarga?','Apakah Anda sering sulit tidur?','Apakah Anda melakukan olahraga secara rutin?','Apakah Anda makan sayur setiap hari?','Apakah Anda makan buah setiap hari?'];
const modules=[['C','Cek kesehatan berkala','Ukur tekanan darah dengan tensimeter tervalidasi, duduk tenang 5 menit, sandarkan punggung, letakkan lengan setinggi jantung, dan catat hasil.'],['E','Enyahkan asap rokok','Hindari rokok dan paparan asap rokok. Buat rencana berhenti dan cari dukungan tenaga kesehatan.'],['R','Rajin aktivitas fisik','Lakukan aktivitas fisik sesuai kondisi kesehatan, mulai bertahap, misalnya berjalan kaki.'],['D','Diet sehat gizi seimbang','Batasi garam dan makanan tinggi natrium. Perbanyak sayur, buah, dan pola makan seimbang.'],['I','Istirahat cukup','Jaga jadwal tidur teratur, kurangi kafein menjelang tidur, dan ciptakan kamar nyaman.'],['K','Kelola stres','Latih pernapasan perlahan dan relaksasi KOGERTA dengan nyaman. Hentikan jika pusing atau tidak nyaman.']];
const quiz=[['Alat utama untuk memastikan tekanan darah adalah…',['Kuesioner saja','Tensimeter tervalidasi','Perkiraan gejala'],1],['Cara membantu mengendalikan tekanan darah adalah…',['Meningkatkan garam','Merokok','Aktivitas fisik sesuai kemampuan'],2],['CERDIK huruf E berarti…',['Enyahkan asap rokok','Evaluasi berat badan','Energi tinggi'],0],['Hasil kuesioner risiko rendah berarti…',['Pasti tidak hipertensi','Tetap perlu cek tekanan darah','Tidak perlu pemeriksaan'],1],['Jika nyeri dada berat atau kelemahan mendadak, tindakan yang tepat adalah…',['Menunggu kuis selesai','Mencari pertolongan darurat','Berolahraga'],1]];
const key='hipcerdik-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};data.answers??={};data.bp??=[];data.habits??={};data.quiz??={};data.screen??='welcome';data.qidx??=0;data.quizAnswers??={};let current=data.screen;function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(s){current=s;data.screen=s;save();render();window.scrollTo(0,0)}function btn(text,fn,alt=false){return `<button class="btn ${alt?'alt':''}" onclick="${fn}">${text}</button>`}function score(){return Q.reduce((n,_,i)=>n+(data.answers[i]===undefined?0:(i<12?data.answers[i]==='ya':data.answers[i]==='tidak')?1:0),0)}function complete(){return Object.keys(data.answers).length===15}function classify(s,d){if(s>=180||d>=120)return ['Sangat tinggi','danger'];if(s>=140||d>=90)return ['Tinggi — perlu evaluasi','alert'];if(s>=120||d>=80)return ['Di atas optimal — pantau','alert'];return ['Di bawah ambang 120/80','good']}function render(){const title={welcome:'Selamat Datang',identity:'Identitas Pengguna',home:'Menu Utama',screen:'Skrining Hipertensi',result:'Hasil Skrining',bp:'Tekanan Darah',education:'Edukasi CERDIK',quiz:'Kuis Pengetahuan',habits:'Target Kebiasaan',dashboard:'Dashboard Monitoring'};document.getElementById('heading').textContent=title[current];document.getElementById('subtitle').textContent=current==='welcome'?'Skrining, edukasi, dan pemantauan dalam satu aplikasi.':'Sehat dimulai dari kebiasaan kecil setiap hari';let h='';switch(current){case 'welcome':h=`<div class="card" style="text-align:center;padding:35px 16px"><div style="font-size:72px">💚</div><h2>HIP-CERDIK</h2><p>Skrining Risiko Hipertensi & Edukasi CERDIK</p><p class="muted">Aplikasi edukasi dan skrining awal, bukan alat diagnosis.</p>${btn('Mulai Sekarang',"go('identity')")}</div><div class="alert">Jika mengalami nyeri dada, sesak berat, gangguan bicara, atau kelemahan mendadak, segera cari pertolongan darurat.</div>`;break;
case 'identity':h=`<div class="card"><h3>Profil Pengguna</h3><label>Nama atau kode pengguna</label><input id="name" value="${esc(data.name)}" placeholder="Misalnya: Peserta 001"><label>Usia (tahun)</label><input id="age" type="number" min="18" max="120" value="${esc(data.age)}"><label>Jenis kelamin</label><select id="sex"><option value="">Pilih</option><option ${data.sex==='Laki-laki'?'selected':''}>Laki-laki</option><option ${data.sex==='Perempuan'?'selected':''}>Perempuan</option></select><label><input id="consent" type="checkbox" style="width:auto" ${data.consent?'checked':''}> Saya memahami data disimpan lokal pada perangkat ini dan aplikasi bukan alat diagnosis.</label>${btn('Simpan & Lanjut', 'saveIdentity()')}</div>`;break;
case 'home':h=`<div class="card"><span class="tag">Halo, ${esc(data.name||'Pengguna')}</span><h2>Mulai hidup lebih CERDIK!</h2><p class="muted">Pilih fitur yang ingin Anda gunakan.</p></div><div class="tiles">${[['🩺','Skrining','screen'],['📋','Hasil Skrining','result'],['❤️','Tekanan Darah','bp'],['📚','Edukasi CERDIK','education'],['🧠','Kuis','quiz'],['☑️','Target Kebiasaan','habits'],['📈','Monitoring','dashboard'],['👤','Profil','identity']].map(x=>`<button class="tile" onclick="go('${x[2]}')"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>`;break;
case 'screen':{let i=data.qidx;if(i>=15){go('result');return}h=`<div class="card"><div class="row"><b>Pertanyaan ${i+1} / 15</b><span class="tag">${Math.round(Object.keys(data.answers).length/15*100)}% terisi</span></div><div class="progress"><span style="width:${Object.keys(data.answers).length/15*100}%"></span></div><h3 style="margin-top:25px">${Q[i]}</h3>${['ya','tidak'].map(v=>`<button class="choice ${data.answers[i]===v?'sel':''}" onclick="answer('${v}')">${v==='ya'?'Ya':'Tidak'}</button>`).join('')}<div class="row">${btn('← Kembali','previousQuestion()',true)}${btn(i===14?'Lihat Hasil →':'Lanjut →','nextQuestion()')}</div></div><p class="muted">Adaptasi instrumen Harahap dkk. (2010). Pertanyaan dan skor penelitian asal dipertahankan. Untuk usia dewasa; belum tervalidasi ulang sebagai aplikasi.</p>`;break}
case 'result':h=complete()?`<div class="card" style="text-align:center"><p>Skor skrining</p><div class="big">${score()} / 15</div><div class="alert ${score()>=7?'danger':'good'}">${score()>=7?'Skrining positif (skor ≥7)':'Skrining negatif (skor <7)'}</div><p>Hasil ini <b>bukan diagnosis</b>. Tetap lakukan pengukuran tekanan darah menggunakan tensimeter. Skrining negatif tidak menyingkirkan hipertensi.</p>${btn('Catat Tekanan Darah',"go('bp')")}${btn('Ulangi Skrining','resetScreen()',true)}</div><div class="card muted">Instrumen asal memiliki sensitivitas 61,6% dan spesifisitas 64,1% pada penelitian tahun 2010. Perlu validasi ulang untuk penggunaan baru.</div>`:`<div class="card"><p>Skrining belum selesai.</p>${btn('Lanjutkan Skrining',"go('screen')")}</div>`;break;
case 'bp':h=`<div class="card"><h3>Catat hasil tensimeter</h3><label>Sistolik (mmHg)</label><input id="sys" type="number" min="50" max="300" placeholder="Contoh: 135"><label>Diastolik (mmHg)</label><input id="dia" type="number" min="30" max="200" placeholder="Contoh: 85"><label>Denyut nadi (opsional, kali/menit)</label><input id="pulse" type="number" min="30" max="220" placeholder="Contoh: 78"><label>Tanggal pemeriksaan</label><input id="bpdate" type="date" value="${new Date().toLocaleDateString('en-CA')}">${btn('Simpan Hasil','addBP()')}</div><div class="card"><h3>Riwayat Tekanan Darah</h3>${data.bp.length?data.bp.slice().reverse().slice(0,8).map(r=>`<p><b>${r.s}/${r.d} mmHg</b> • ${esc(r.date)}<br><span class="muted">${classify(r.s,r.d)[0]}</span></p>`).join(''):'<p class="muted">Belum ada catatan.</p>'}</div><div class="alert">Kategori di layar ini adalah indikator tindak lanjut awal, bukan diagnosis. Bila tekanan darah ≥180 sistolik atau ≥120 diastolik, ulangi pengukuran setelah istirahat singkat dan segera hubungi layanan kesehatan. Bila disertai gejala bahaya, cari pertolongan darurat.</div>`;break;
case 'education':h=`<div class="card" style="border:2px solid #b4e5d1;background:#f1fbf6"><span class="tag">🎬 Panduan Belajar KOGERTA</span><h3 style="margin-top:10px">Video Relaksasi KOGERTA</h3><p>Pelajari latihan KOGERTA melalui video YouTube yang disediakan. Video dibuka pada menit 11:27 sesuai tautan panduan.</p><a class="btn" style="display:inline-block;text-decoration:none" href="https://www.youtube.com/watch?v=XDYEHxuTUJA&t=687s" target="_blank" rel="noopener noreferrer">▶ Tonton Panduan di YouTube</a><p class="muted">Internet diperlukan. Latihan sesuai kemampuan; hentikan jika pusing atau tidak nyaman. KOGERTA bukan pengganti pengobatan hipertensi.</p></div>`+modules.map((m,i)=>`<div class="card"><span class="tag">${m[0]} • CERDIK</span><h3 style="margin-top:9px">${m[1]}</h3><p>${m[2]}</p>${btn('Tandai telah dipelajari',`learn(${i})`,true)} ${data.learned?.includes(i)?'✓':''}</div>`).join('')+btn('Mulai Kuis',"go('quiz')");break;
case 'quiz':h=`<div class="card"><h3>Kuis Pengetahuan (5 soal)</h3><p class="muted">Pilih satu jawaban untuk setiap soal.</p>${quiz.map((q,i)=>`<div style="padding:12px 0;border-bottom:1px solid #e1ece6"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<button class="choice ${data.quizAnswers[i]===j?'sel':''}" onclick="quizAnswer(${i},${j})">${a}</button>`).join('')}</div>`).join('')}${btn('Periksa Jawaban','gradeQuiz()')}<div id="quizResult">${data.quizScore===undefined?'':`<p class="alert good">Nilai terakhir: ${data.quizScore}/100</p>`}</div></div>`;break;
case 'habits':{const today=new Date().toLocaleDateString('en-CA'),arr=data.habits[today]||[];h=`<div class="card"><h3>Target CERDIK Hari Ini</h3><p class="muted">${today} • ${arr.length} dari 6 target</p><div class="progress"><span style="width:${arr.length/6*100}%"></span></div>${['Cek kesehatan sesuai jadwal pribadi','Menghindari rokok dan asap rokok','Aktivitas fisik sesuai kemampuan','Memilih makanan rendah garam dan bergizi','Menjaga istirahat cukup','Mengelola stres / relaksasi'].map((v,i)=>`<div class="check"><input type="checkbox" id="habit${i}" ${arr.includes(i)?'checked':''} onchange="toggleHabit(${i},this.checked)"><label for="habit${i}">${v}</label></div>`).join('')}</div><p class="muted">Target pemeriksaan tekanan darah disesuaikan dengan jadwal pribadi, tidak wajib setiap hari. Checklist bersifat pelaporan mandiri.</p>`;break}
case 'dashboard':{const last=data.bp[data.bp.length-1],days=Object.keys(data.habits).sort().slice(-7),avg=days.length?Math.round(days.reduce((n,d)=>n+data.habits[d].length,0)/days.length/6*100):0;h=`<div class="tiles"><div class="card"><div class="muted">Skrining</div><div class="big">${complete()?score()+'/15':'—'}</div></div><div class="card"><div class="muted">TD terakhir</div><div class="big" style="font-size:24px">${last?last.s+'/'+last.d:'—'}</div></div><div class="card"><div class="muted">Kuis</div><div class="big">${data.quizScore??'—'}</div></div><div class="card"><div class="muted">Kebiasaan (hari tercatat)</div><div class="big">${avg}%</div></div></div><div class="card"><h3>Grafik Sistolik dan Diastolik</h3>${chart()}<p class="muted">Grafik dari hasil pengukuran yang dimasukkan pengguna.</p></div><div class="card"><h3>Ringkasan CERDIK</h3><p>Materi dipelajari: ${(data.learned||[]).length}/6</p><p>Hari checklist tercatat: ${Object.keys(data.habits).length}</p>${btn('Ekspor Data CSV','exportCSV()')}${btn('Kembali ke Menu',"go('home')",true)}</div>`;break}}
document.getElementById('content').innerHTML=h;const nav=[['⌂','Menu','home'],['🩺','Skrining','screen'],['❤️','TD','bp'],['📚','CERDIK','education'],['📈','Hasil','dashboard']];document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${current===x[2]?'active':''}" onclick="go('${x[2]}')"><div style="font-size:21px">${x[0]}</div>${x[1]}</button>`).join('')}
function saveIdentity(){const name=document.getElementById('name').value.trim(),age=Number(document.getElementById('age').value),sex=document.getElementById('sex').value,consent=document.getElementById('consent').checked;if(!name||age<18||age>120||!sex||!consent){alert('Lengkapi identitas, usia dewasa (18–120 tahun), dan persetujuan.');return}Object.assign(data,{name,age,sex,consent});save();go('home')}
function answer(v){data.answers[data.qidx]=v;save();render()}function previousQuestion(){data.qidx=Math.max(0,data.qidx-1);save();render()}function nextQuestion(){if(data.answers[data.qidx]===undefined){alert('Pilih Ya atau Tidak terlebih dahulu.');return}if(data.qidx===14){if(!complete()){alert('Jawab semua pertanyaan.');return}go('result')}else{data.qidx++;save();render()}}function resetScreen(){if(!confirm('Ulangi dan hapus jawaban skrining sebelumnya?'))return;data.answers={};data.qidx=0;save();go('screen')}
function addBP(){let s=Number(document.getElementById('sys').value),d=Number(document.getElementById('dia').value),p=document.getElementById('pulse').value,date=document.getElementById('bpdate').value;if(!Number.isInteger(s)||!Number.isInteger(d)||s<50||s>300||d<30||d>200||s<=d||!date||(p&&(Number(p)<30||Number(p)>220))){alert('Periksa nilai tekanan darah dan tanggal.');return}data.bp.push({s,d,p:p?Number(p):null,date});save();let c=classify(s,d);alert(`Data tersimpan. Hasil: ${s}/${d} mmHg. ${c[0]}. Ini bukan diagnosis.`);render()}
function learn(i){data.learned??=[];if(!data.learned.includes(i))data.learned.push(i);save();render()}function quizAnswer(i,j){data.quizAnswers[i]=j;save();render()}function gradeQuiz(){if(Object.keys(data.quizAnswers).length<quiz.length){alert('Jawab semua pertanyaan terlebih dahulu.');return}data.quizScore=quiz.reduce((n,q,i)=>n+(data.quizAnswers[i]===q[2]?20:0),0);save();render()}function toggleHabit(i,v){let d=new Date().toLocaleDateString('en-CA');data.habits[d]??=[];data.habits[d]=v?[...new Set([...data.habits[d],i])]:data.habits[d].filter(x=>x!==i);save();render()}
function chart(){let a=data.bp.slice(-8);if(!a.length)return '<p class="muted">Belum ada data grafik.</p>';let vals=a.flatMap(x=>[x.s,x.d]),min=Math.max(0,Math.min(...vals)-20),max=Math.max(...vals)+20,xx=i=>30+i*(330/Math.max(a.length-1,1)),yy=v=>145-(v-min)/(max-min)*115;let line=k=>a.map((r,i)=>`${i?'L':'M'}${xx(i)},${yy(r[k])}`).join(' ');return `<svg viewBox="0 0 380 170" role="img" aria-label="Grafik tren tekanan darah"><line x1="30" y1="145" x2="365" y2="145" stroke="#9eb9af"/><path d="${line('s')}" stroke="#0a9473" stroke-width="3" fill="none"/><path d="${line('d')}" stroke="#d28a24" stroke-width="3" fill="none"/>${a.map((r,i)=>`<circle cx="${xx(i)}" cy="${yy(r.s)}" r="4" fill="#0a9473"/><circle cx="${xx(i)}" cy="${yy(r.d)}" r="4" fill="#d28a24"/>`).join('')}<text x="35" y="164" font-size="11" fill="#527a6d">● Sistolik (hijau)   ● Diastolik (oranye)</text></svg>`}
function exportCSV(){let rows=[['jenis','tanggal','sistolik','diastolik','nadi','skor_skrining','nilai_kuis'],...data.bp.map(x=>['tekanan_darah',x.date,x.s,x.d,x.p??'',complete()?score():'',data.quizScore??''])];rows.push(['ringkasan','', '', '', '',complete()?score():'',data.quizScore??'']);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HIP_CERDIK_data.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
